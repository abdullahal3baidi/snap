<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnapVault</title>
    
    <!-- إعدادات تطبيق الآيفون PWA الكاملة لمنع ظهور أشرطة سفاري -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SnapVault">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/en/thumb/c/c4/Snapchat_logo.svg/512px-Snapchat_logo.svg.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .snap-ring {
            background: linear-gradient(135deg, #FFFC00 0%, #ff8800 50%, #ff0055 100%);
            padding: 2.5px;
        }
        .card-glass {
            background: #121214;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto">

    <!-- الهيدر -->
    <header class="px-5 py-4 flex items-center justify-between sticky top-0 z-20 bg-black/90 backdrop-blur-xl border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-[#FFFC00] flex items-center justify-center text-black shadow-lg shadow-yellow-400/20">
                <i class="fa-brands fa-snapchat text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight">Snap<span class="text-[#FFFC00]">Vault</span></h1>
                <p class="text-[11px] text-zinc-400">تصفح فوري بشاشة كاملة</p>
            </div>
        </div>
        <button onclick="toggleAddModal()" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/10 flex items-center justify-center text-white active:scale-90 transition">
            <i class="fa-solid fa-user-plus text-sm"></i>
        </button>
    </header>

    <!-- المحتوى -->
    <main class="flex-1 p-4 space-y-4">
        
        <div class="card-glass rounded-2xl p-1.5 flex items-center gap-2">
            <i class="fa-solid fa-bolt text-[#FFFC00] mr-3 text-sm"></i>
            <input type="text" id="quickUser" placeholder="اكتب يوزر السناب للفتح السريع..." 
                class="bg-transparent w-full text-sm text-white focus:outline-none py-2" dir="ltr">
            <button onclick="openQuickUser()" class="bg-[#FFFC00] text-black font-extrabold text-xs px-4 py-2.5 rounded-xl shrink-0 active:scale-95 transition">
                فتح
            </button>
        </div>

        <div class="flex items-center justify-between px-1 pt-1">
            <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">الحسابات المفضلة</h2>
            <span id="accountCount" class="text-xs font-bold text-[#FFFC00]">0</span>
        </div>

        <div id="accountsGrid" class="space-y-2.5"></div>

    </main>

    <!-- نافذة إضافة حساب -->
    <div id="addModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-5">
        <div class="card-glass w-full max-w-sm rounded-3xl p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-extrabold text-lg">إضافة حساب سناب</h3>
                <button onclick="toggleAddModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <input type="text" id="newUsernameInput" placeholder="Username (e.g. najla_ali33)" 
                class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#FFFC00]" dir="ltr">
            <button onclick="addNewAccount()" class="w-full bg-[#FFFC00] text-black font-extrabold py-3 rounded-xl active:scale-95 transition">
                إضافة للحسابات
            </button>
        </div>
    </div>

    <!-- إطار عرض داخلي بشاشة كاملة 100% لمنع سفاري الآيفون من فتح نافذة منبثقة -->
    <div id="pwaAppFrameContainer" class="fixed inset-0 z-[9999] bg-black hidden">
        <iframe id="pwaAppFrame" class="w-full h-full border-0" allow="autoplay; fullscreen; clipboard-write; web-share"></iframe>
    </div>

    <footer class="p-4 text-center text-[11px] text-zinc-500 border-t border-white/5">
        للتثبيت كتطبيق آيفون: اضغط مشاركة <i class="fa-solid fa-arrow-up-from-bracket mx-1 text-zinc-300"></i> ثم <b>إضافة إلى الشاشة الرئيسية</b>
    </footer>

    <script>
        // حقن ملف Manifest ديناميكياً لتعريف الآيفون أن نطاق الموقع بالكامل تطبيق واحد
        (function injectManifest() {
            const manifest = {
                name: "SnapVault",
                short_name: "SnapVault",
                start_url: "./index.html",
                scope: "./",
                display: "standalone",
                background_color: "#000000",
                theme_color: "#000000",
                icons: [{
                    src: "https://upload.wikimedia.org/wikipedia/en/thumb/c/c4/Snapchat_logo.svg/512px-Snapchat_logo.svg.png",
                    sizes: "512x512",
                    type: "image/png"
                }]
            };
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
            document.head.appendChild(link);
        })();

        const defaultAccounts = [
            { username: 'najla_ali33', name: 'نجمه 🌟', avatar: '' },
            { username: 'o_0lix', name: 'sarah', avatar: '' },
          
        ];

        let accounts = JSON.parse(localStorage.getItem('snapvault_fast_accounts')) || defaultAccounts;

        function saveAccounts() {
            localStorage.setItem('snapvault_fast_accounts', JSON.stringify(accounts));
        }

        function renderAccounts() {
            const grid = document.getElementById('accountsGrid');
            document.getElementById('accountCount').innerText = accounts.length;
            grid.innerHTML = '';

            accounts.forEach((acc, index) => {
                const cleanUser = acc.username.toLowerCase().trim();
                const fallbackAvatar = `https://app.snapchat.com/web/deeplink/snapcode?username=${cleanUser}&type=SVG&bitmoji=enable`;
                const avatarSrc = acc.avatar || fallbackAvatar;

                const card = document.createElement('div');
                card.className = 'card-glass rounded-2xl p-3 flex items-center justify-between active:scale-[0.98] transition cursor-pointer';
                card.onclick = () => goToUser(cleanUser);
                card.innerHTML = `
                    <div class="flex items-center gap-3.5 flex-1 min-w-0">
                        <div class="snap-ring rounded-full shrink-0">
                            <img id="avatar-${cleanUser}" src="${avatarSrc}" onerror="this.src='${fallbackAvatar}'" 
                                class="w-14 h-14 rounded-full object-cover bg-zinc-900 border-2 border-black">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 id="name-${cleanUser}" class="font-extrabold text-base text-white truncate">${acc.name || cleanUser}</h3>
                            <p class="text-xs text-[#FFFC00] font-mono truncate" dir="ltr">@${cleanUser}</p>
                            <p id="bio-${cleanUser}" class="text-[11px] text-zinc-400 truncate mt-0.5">${acc.bio || ''}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 mr-2">
                        <button onclick="deleteAccount(event, ${index})" class="w-8 h-8 rounded-full bg-zinc-900 text-zinc-500 hover:text-red-400 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                        <div class="w-8 h-8 rounded-full bg-[#FFFC00]/10 text-[#FFFC00] flex items-center justify-center">
                            <i class="fa-solid fa-play text-xs"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);

                fetchFastProfile(acc, index);
            });
        }

        async function fetchFastProfile(acc, index) {
            const cleanUser = acc.username.toLowerCase().trim();
            const targetUrl = `https://www.snapchat.com/@${cleanUser}`;
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
            ];

            try {
                const html = await Promise.any(proxies.map(p => fetch(p).then(r => {
                    if (!r.ok) throw new Error();
                    return r.text();
                })));

                const doc = new DOMParser().parseFromString(html, 'text/html');
                const nextEl = doc.getElementById('__NEXT_DATA__');
                if (nextEl) {
                    const json = JSON.parse(nextEl.textContent);
                    const pub = json?.props?.pageProps?.userProfile?.publicProfileInfo || json?.props?.pageProps?.publicProfileInfo;
                    if (pub) {
                        acc.name = pub.title || acc.name;
                        acc.bio = pub.bio || acc.bio;
                        acc.avatar = pub.profilePictureUrl || pub.squareHeroImageUrl || acc.avatar;
                    }
                }

                const avEl = document.getElementById(`avatar-${cleanUser}`);
                const nmEl = document.getElementById(`name-${cleanUser}`);
                const biEl = document.getElementById(`bio-${cleanUser}`);
                if (avEl && acc.avatar) avEl.src = acc.avatar;
                if (nmEl && acc.name) nmEl.innerText = acc.name;
                if (biEl && acc.bio) biEl.innerText = acc.bio;

                accounts[index] = acc;
                saveAccounts();
            } catch (e) {}
        }

        // فتح الحساب داخل نفس نافذة التطبيق الكاملة بدون إطلاق متصفح الآيفون المصغر!
        function goToUser(username) {
            const clean = username.trim().replace('@', '').toLowerCase();
            const targetUrl = `users.html?user=${encodeURIComponent(clean)}`;
            
            // إذا كان التطبيق مثبتاً على الشاشة الرئيسية للآيفون، نفتح الصفحة داخل إطار كامل 100% لمنع ظهور شريط سفاري نهائياً
            const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
            if (isStandalone) {
                const container = document.getElementById('pwaAppFrameContainer');
                const frame = document.getElementById('pwaAppFrame');
                frame.src = targetUrl;
                container.classList.remove('hidden');
            } else {
                window.location.assign(targetUrl);
            }
        }

        // استقبال أمر الرجوع من صفحة الحساب عند العمل بوضع تطبيق الآيفون
        window.addEventListener('message', (e) => {
            if (e.data === 'CLOSE_USER_VIEW') {
                const container = document.getElementById('pwaAppFrameContainer');
                const frame = document.getElementById('pwaAppFrame');
                frame.src = 'about:blank';
                container.classList.add('hidden');
            }
        });

        function openQuickUser() {
            const val = document.getElementById('quickUser').value.trim().replace('@', '').toLowerCase();
            if (val) goToUser(val);
        }

        function toggleAddModal() {
            const modal = document.getElementById('addModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function addNewAccount() {
            const input = document.getElementById('newUsernameInput');
            const username = input.value.trim().replace('@', '').toLowerCase();
            if (!username) return;
            if (!accounts.some(a => a.username.toLowerCase() === username)) {
                accounts.unshift({ username, name: username, bio: '', avatar: '' });
                saveAccounts();
                renderAccounts();
            }
            input.value = '';
            toggleAddModal();
        }

        function deleteAccount(e, index) {
            e.stopPropagation();
            accounts.splice(index, 1);
            saveAccounts();
            renderAccounts();
        }

        renderAccounts();
    </script>
</body>
</html>
