<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnapVault</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/en/thumb/c/c4/Snapchat_logo.svg/512px-Snapchat_logo.svg.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #000;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .snap-ring {
            background: linear-gradient(135deg, #FFFC00, #ff8800, #ff0055);
            padding: 2.5px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col max-w-md mx-auto">

    <header class="px-5 py-4 flex items-center justify-between sticky top-0 z-20 bg-black/90 backdrop-blur-md border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-[#FFFC00] flex items-center justify-center text-black">
                <i class="fa-brands fa-snapchat text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold">Snap<span class="text-[#FFFC00]">Vault</span></h1>
                <p class="text-[11px] text-zinc-400">تصفح فوري بشاشة كاملة</p>
            </div>
        </div>
        <button onclick="toggleModal()" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/10 flex items-center justify-center text-white active:scale-90 transition">
            <i class="fa-solid fa-user-plus text-sm"></i>
        </button>
    </header>

    <main class="flex-1 p-4 space-y-4">
        <div class="bg-zinc-900/90 border border-white/10 rounded-2xl p-1.5 flex items-center gap-2">
            <i class="fa-solid fa-bolt text-[#FFFC00] mr-3 text-sm"></i>
            <input type="text" id="quickUser" placeholder="اكتب يوزر السناب للفتح السريع..." 
                class="bg-transparent w-full text-sm text-white focus:outline-none py-2" dir="ltr">
            <button onclick="openQuick()" class="bg-[#FFFC00] text-black font-extrabold text-xs px-4 py-2.5 rounded-xl shrink-0 active:scale-95">
                فتح
            </button>
        </div>

        <div class="flex items-center justify-between px-1">
            <h2 class="text-xs font-bold text-zinc-400">الحسابات المفضلة</h2>
            <span id="accountCount" class="text-xs font-bold text-[#FFFC00]">0</span>
        </div>

        <div id="accountsGrid" class="space-y-2.5"></div>
    </main>

    <!-- نافذة إضافة يوزر -->
    <div id="addModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-5">
        <div class="bg-zinc-900 border border-white/10 w-full max-w-sm rounded-3xl p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-extrabold text-base">إضافة يوزر جديد</h3>
                <button onclick="toggleModal()" class="text-zinc-400"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <input type="text" id="newUsernameInput" placeholder="Username (e.g. najla_ali33)" 
                class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#FFFC00]" dir="ltr">
            <button onclick="addNewUser()" class="w-full bg-[#FFFC00] text-black font-extrabold py-3 rounded-xl active:scale-95">
                إضافة
            </button>
        </div>
    </div>

    <!-- إطار عرض الحسابات بملء الشاشة لتطبيق الآيفون -->
    <div id="pwaFrameWrap" class="fixed inset-0 z-[9999] bg-black hidden">
        <iframe id="pwaFrame" class="w-full h-full border-0" allow="autoplay; fullscreen"></iframe>
    </div>

    <script>
        // =====================================================
        // ضع اليوزرات هنا فقط (كل البيانات تُسحب ديناميكياً)
        // =====================================================
        const DEFAULT_USERNAMES = [
            'najla_ali33',
            'o_0lix',
            'iiv.l19'
        ];

        let usernames = JSON.parse(localStorage.getItem('sv_clean_users')) || DEFAULT_USERNAMES;
        let metaCache = JSON.parse(localStorage.getItem('sv_clean_meta') || '{}');

        function saveList() {
            localStorage.setItem('sv_clean_users', JSON.stringify(usernames));
        }

        function renderList() {
            const grid = document.getElementById('accountsGrid');
            document.getElementById('accountCount').innerText = usernames.length;
            grid.innerHTML = '';

            usernames.forEach((rawUser, index) => {
                const u = rawUser.toLowerCase().trim();
                const cached = metaCache[u] || {};
                const snapcode = `https://app.snapchat.com/web/deeplink/snapcode?username=${u}&type=SVG&bitmoji=enable`;
                const avatar = cached.avatar || snapcode;
                const name = cached.name || u;
                const bio = cached.bio || '';

                const card = document.createElement('div');
                card.className = 'bg-zinc-900/80 border border-white/10 rounded-2xl p-3 flex items-center justify-between active:scale-[0.98] transition cursor-pointer';
                card.onclick = () => openUser(u);
                card.innerHTML = `
                    <div class="flex items-center gap-3.5 flex-1 min-w-0">
                        <div class="snap-ring rounded-full shrink-0">
                            <img id="av-${u}" src="${avatar}" onerror="this.src='${snapcode}'" class="w-14 h-14 rounded-full object-cover bg-black border-2 border-black">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 id="nm-${u}" class="font-extrabold text-base text-white truncate">${name}</h3>
                            <p class="text-xs text-[#FFFC00] font-mono truncate" dir="ltr">@${u}</p>
                            <p id="bi-${u}" class="text-[11px] text-zinc-400 truncate mt-0.5">${bio}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 mr-2">
                        <button onclick="removeUser(event, ${index})" class="w-8 h-8 rounded-full bg-black/60 text-zinc-500 hover:text-red-400 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                        <div class="w-8 h-8 rounded-full bg-[#FFFC00]/15 text-[#FFFC00] flex items-center justify-center">
                            <i class="fa-solid fa-play text-xs"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);

                fetchDynamicProfile(u);
            });
        }

        // استخدام الرابط النظيف تماماً كما يطلبه سناب شات
        async function fetchDynamicProfile(u) {
            const cleanUrl = `https://www.snapchat.com/@${u}`;
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(cleanUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(cleanUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(cleanUrl)}`
            ];

            for (const proxy of proxies) {
                try {
                    const res = await fetch(proxy);
                    if (!res.ok) continue;
                    const html = await res.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const nextEl = doc.getElementById('__NEXT_DATA__');
                    if (!nextEl) continue;

                    const json = JSON.parse(nextEl.textContent);
                    const props = json?.props?.pageProps;
                    if (!props) continue;

                    const pub = props?.userProfile?.publicProfileInfo || props?.publicProfileInfo;
                    const usr = props?.userProfile?.userInfo || props?.userInfo;
                    const info = pub || usr || {};

                    const name = info.title || info.displayName || u;
                    const bio = info.bio || '';
                    const avatar = info.profilePictureUrl 
                                || info.squareHeroImageUrl 
                                || info.bitmoji3d?.avatarImage?.url 
                                || doc.querySelector('meta[property="og:image"]')?.content 
                                || '';

                    metaCache[u] = { name, bio, avatar };
                    localStorage.setItem('sv_clean_meta', JSON.stringify(metaCache));

                    if (avatar && document.getElementById(`av-${u}`)) document.getElementById(`av-${u}`).src = avatar;
                    if (name && document.getElementById(`nm-${u}`)) document.getElementById(`nm-${u}`).innerText = name;
                    if (bio && document.getElementById(`bi-${u}`)) document.getElementById(`bi-${u}`).innerText = bio;
                    break;
                } catch (e) {}
            }
        }

        function openUser(u) {
            const target = `users.html?user=${encodeURIComponent(u)}`;
            const isPWA = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
            if (isPWA) {
                const wrap = document.getElementById('pwaFrameWrap');
                const frame = document.getElementById('pwaFrame');
                frame.src = target;
                wrap.classList.remove('hidden');
            } else {
                window.location.href = target;
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data === 'CLOSE_USER_VIEW') {
                document.getElementById('pwaFrame').src = 'about:blank';
                document.getElementById('pwaFrameWrap').classList.add('hidden');
            }
        });

        function openQuick() {
            const val = document.getElementById('quickUser').value.trim().replace('@', '').toLowerCase();
            if (val) openUser(val);
        }

        function toggleModal() {
            const m = document.getElementById('addModal');
            m.classList.toggle('hidden');
            m.classList.toggle('flex');
        }

        function addNewUser() {
            const inp = document.getElementById('newUsernameInput');
            const val = inp.value.trim().replace('@', '').toLowerCase();
            if (val && !usernames.includes(val)) {
                usernames.unshift(val);
                saveList();
                renderList();
            }
            inp.value = '';
            toggleModal();
        }

        function removeUser(e, idx) {
            e.stopPropagation();
            usernames.splice(idx, 1);
            saveList();
            renderList();
        }

        renderList();
    </script>
</body>
</html>
