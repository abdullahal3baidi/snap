<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnapVault - استعراض</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #000;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }
        .snap-ring {
            background: linear-gradient(135deg, #FFFC00, #ff8800, #ff0055);
            padding: 2.5px;
        }
        .tab-active {
            color: #fff;
            border-bottom: 2.5px solid #FFFC00;
        }
        /* مشغل السناب بشاشة كاملة 100% */
        #storyViewer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #000;
            z-index: 9999;
            touch-action: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        #storyMediaStage video,
        #storyMediaStage img {
            width: 100vw;
            height: 100dvh;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }
        .viewer-holding .viewer-ui { opacity: 0 !important; }
    </style>
</head>
<body class="min-h-screen max-w-md mx-auto flex flex-col relative pb-32">

    <!-- الشريط العلوي -->
    <nav class="sticky top-0 z-30 bg-black/90 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-white/10">
        <button onclick="goBack()" class="w-9 h-9 rounded-full bg-zinc-900 flex items-center justify-center text-white active:scale-90">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="flex flex-col items-center">
            <span id="navUsername" class="text-sm font-bold font-mono text-zinc-200" dir="ltr">@user</span>
            <span id="liveIndicator" class="text-[10px] text-emerald-400 hidden">● محدث لحظياً</span>
        </div>
        <button onclick="fetchLiveSnapData(true)" class="w-9 h-9 rounded-full bg-zinc-900 flex items-center justify-center text-white active:scale-90">
            <i class="fa-solid fa-rotate-right text-sm" id="refreshIcon"></i>
        </button>
    </nav>

    <!-- معلومات الحساب -->
    <section class="p-4 flex flex-col items-start border-b border-white/10">
        <div class="flex items-center gap-3.5 w-full">
            <div class="relative shrink-0 cursor-pointer" onclick="playAllFromOldest()">
                <div class="snap-ring rounded-full">
                    <img id="profileAvatar" src="" class="w-18 h-18 w-[74px] h-[74px] rounded-full object-cover bg-zinc-900 border-2 border-black">
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <h2 id="profileName" class="text-lg font-extrabold truncate">...</h2>
                <p id="profileSub" class="text-xs text-zinc-400 font-mono truncate" dir="ltr">@username</p>
                <p id="lastSyncTime" class="text-[11px] text-[#FFFC00] mt-0.5"></p>
            </div>
        </div>

        <p id="profileBio" class="text-xs text-zinc-300 mt-2.5 leading-relaxed"></p>

        <div class="flex items-center gap-2 mt-3.5 w-full">
            <button onclick="playAllFromOldest()" class="flex-1 bg-[#FFFC00] text-black font-extrabold text-xs py-2.5 px-3 rounded-full flex items-center justify-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-bolt"></i> تشغيل الستوري (<span id="activeCountBadge">0</span>)
            </button>
            <button id="selectModeBtn" onclick="toggleSelectMode()" class="bg-zinc-900 text-white font-bold text-xs py-2.5 px-3.5 rounded-full border border-white/15 active:scale-95">
                تحديد ودمج
            </button>
        </div>
    </section>

    <!-- بطاقة معاينة آخر سنابة نزلت (تفتح القصة كاملة من الأقدم للأحدث فوراً) -->
    <section id="featuredSection" class="px-4 pt-3.5 hidden">
        <div onclick="playAllFromOldest()" class="relative w-48 mx-auto aspect-[9/16] rounded-2xl overflow-hidden bg-zinc-900 border-2 border-[#FFFC00] cursor-pointer active:scale-95 transition">
            <img id="featuredThumb" src="" class="w-full h-full object-cover">
            <video id="featuredVid" muted playsinline preload="metadata" class="w-full h-full object-cover hidden"></video>
            <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/40"></div>
            <div class="absolute top-2.5 right-2.5 left-2.5 flex justify-between items-center">
                <span id="featuredBadge" class="bg-black/75 text-white text-[10px] font-extrabold px-2 py-0.5 rounded">Snaps: 0</span>
                <span class="bg-[#FFFC00] text-black text-[10px] font-extrabold px-2 py-0.5 rounded">جديد</span>
            </div>
            <div class="absolute bottom-2.5 inset-x-2.5">
                <div class="w-full bg-[#FFFC00] text-black font-extrabold text-[11px] py-2 rounded-xl text-center shadow">
                    <i class="fa-solid fa-play ml-1"></i> مشاهدة القصة كاملة
                </div>
            </div>
        </div>
    </section>

    <!-- التبويبات -->
    <div class="flex border-b border-white/10 bg-black sticky top-[61px] z-20 text-xs font-extrabold text-zinc-400 mt-3">
        <button onclick="switchTab('stories')" id="tab-stories" class="flex-1 py-3 text-center tab-active">الستوري (<span id="cStories">0</span>)</button>
        <button onclick="switchTab('highlights')" id="tab-highlights" class="flex-1 py-3 text-center">القديمة (<span id="cHighlights">0</span>)</button>
        <button onclick="switchTab('spotlight')" id="tab-spotlight" class="flex-1 py-3 text-center">الأضواء (<span id="cSpot">0</span>)</button>
        <button onclick="switchTab('all')" id="tab-all" class="flex-1 py-3 text-center">الكل (<span id="cAll">0</span>)</button>
    </div>

    <!-- الفرز -->
    <div class="px-4 py-2.5 flex items-center justify-between text-xs text-zinc-400">
        <select id="sortSelect" onchange="renderGrid()" class="bg-zinc-900 text-white font-bold px-3 py-1.5 rounded-xl border border-white/10 focus:outline-none">
            <option value="oldest">الأقدم أولاً (تسلسل القصة)</option>
            <option value="newest">الأحدث أولاً</option>
        </select>
        <button onclick="selectAllVisible()" id="selectAllBtn" class="hidden text-[#FFFC00] font-extrabold">تحديد الكل</button>
    </div>

    <!-- حالة الجلب -->
    <div id="loadingBox" class="py-12 flex flex-col items-center justify-center text-center">
        <div class="w-8 h-8 border-2 border-[#FFFC00] border-t-transparent rounded-full animate-spin mb-2"></div>
        <p class="text-xs text-zinc-400">جاري فتح الاتصال المباشر بسناب شات...</p>
    </div>

    <!-- الشبكة -->
    <main id="mediaGrid" class="px-4 grid grid-cols-2 gap-2.5"></main>

    <!-- شريط الدمج والتحميل -->
    <div id="mergeBar" class="fixed bottom-4 inset-x-4 max-w-md mx-auto z-40 bg-zinc-950/95 border border-[#FFFC00] rounded-2xl p-3 hidden flex-col gap-2 shadow-2xl">
        <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold">محدد: <b id="selCount" class="text-[#FFFC00]">0</b></span>
            <div class="flex gap-2">
                <button onclick="downloadSelectedSeparate()" class="bg-zinc-800 text-white text-xs font-bold px-3 py-2 rounded-xl">منفصل</button>
                <button id="mergeBtn" onclick="mergeSelectedWithAudio()" class="bg-[#FFFC00] text-black text-xs font-extrabold px-3.5 py-2 rounded-xl">دمج بفيديو واحد</button>
            </div>
        </div>
        <div id="progWrap" class="hidden flex-col gap-1">
            <div class="flex justify-between text-[10px] font-bold">
                <span id="progLabel" class="text-zinc-300">جاري المعالجة...</span>
                <span id="progPct" class="text-[#FFFC00]">0%</span>
            </div>
            <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                <div id="progFill" class="h-full bg-[#FFFC00]" style="width:0%"></div>
            </div>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- مشغل السناب الفوري (الخط الزمني والتنقل من اليسار لليمين LTR كما طلبت) -->
    <!-- ========================================================================= -->
    <div id="storyViewer" class="hidden" dir="ltr">
        <div id="storyMediaStage" class="w-full h-full relative">
            <video id="vPlayer" playsinline webkit-playsinline preload="auto" class="hidden"></video>
            <img id="iPlayer" src="" class="hidden">
            <!-- تحميل مسبق للسنابتين القادمتين لضمان سرعة خارقة بدون أي انتظار -->
            <video id="preloadV1" preload="auto" class="hidden" muted></video>
            <video id="preloadV2" preload="auto" class="hidden" muted></video>
        </div>

        <!-- واجهة المشغل العلوية باتجاه من اليسار لليمين LTR -->
        <div class="viewer-ui absolute top-0 inset-x-0 pt-[env(safe-area-inset-top)] bg-gradient-to-b from-black/80 via-black/30 to-transparent z-20 p-3" dir="ltr">
            <!-- شريط التقدم يبدأ من اليسار ويتجه لليمين -->
            <div id="viewerBars" class="flex gap-1 mb-2.5 pt-1" dir="ltr"></div>

            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-2.5">
                    <img id="vAvatar" src="" class="w-9 h-9 rounded-full object-cover border border-[#FFFC00]">
                    <div class="text-left">
                        <h4 id="vName" class="text-xs font-extrabold text-white drop-shadow"></h4>
                        <p id="vTime" class="text-[10px] text-zinc-200 drop-shadow"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2.5">
                    <button onclick="event.stopPropagation(); downloadCurrentInViewer()" 
                        class="w-9 h-9 rounded-full bg-black/45 backdrop-blur-md text-white flex items-center justify-center border border-white/15 active:scale-90">
                        <i class="fa-solid fa-download text-xs"></i>
                    </button>
                    <button onclick="event.stopPropagation(); closeViewer()" 
                        class="w-9 h-9 rounded-full bg-black/45 backdrop-blur-md text-white flex items-center justify-center border border-white/15 active:scale-90">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="viewer-ui absolute bottom-5 inset-x-0 flex justify-center z-20 pointer-events-none">
            <span id="vCounter" class="bg-black/50 backdrop-blur-md text-white text-[11px] font-bold px-3 py-1 rounded-full">1 / 1</span>
        </div>
    </div>

    <canvas id="mergeCanvas" width="540" height="960" class="hidden"></canvas>

    <script>
        const username = (new URLSearchParams(window.location.search).get('user') || 'najla_ali33').replace('@', '').trim().toLowerCase();
        const snapcodeUrl = `https://app.snapchat.com/web/deeplink/snapcode?username=${username}&type=SVG&bitmoji=enable`;

        let allItems = [];
        let activeStories = [];
        let gridItems = [];
        let viewerQueue = [];
        let currentTab = 'stories';
        let isSelectMode = false;
        let selectedIds = new Set();

        let vIndex = 0;
        let imgTimer = null;
        let isPaused = false;
        let startX = 0, startY = 0, startTime = 0, holdTimer = null;
        let bestTimestampLoaded = 0;

        document.getElementById('navUsername').innerText = `@${username}`;
        document.getElementById('profileName').innerText = username;
        document.getElementById('profileSub').innerText = `@${username}`;
        document.getElementById('profileAvatar').src = snapcodeUrl;
        document.getElementById('vAvatar').src = snapcodeUrl;

        function goBack() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage('CLOSE_USER_VIEW', '*');
            } else {
                window.location.href = 'index.html';
            }
        }

        // =========================================================================
        // محرك الجلب اللحظي الذكي: يعرض أسرع رد فوراً ثم يحدثه إذا وصل رد أحدث زمنياً!
        // =========================================================================
        async function fetchLiveSnapData(isManualRefresh = false) {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('animate-spin');
            if (isManualRefresh) bestTimestampLoaded = 0;

            const ts = Date.now();
            // نستخدم مساري سناب شات (@ و /add/) مع كاسر كاش متغير لضمان عدم جلب نسخة قديمة أبداً
            const urlAt = `https://www.snapchat.com/@${username}?locale=ar&_t=${ts}`;
            const urlAdd = `https://www.snapchat.com/add/${username}?locale=ar&_t=${ts}`;
            const urlClean = `https://www.snapchat.com/@${username}`;

            const endpoints = [
                `https://corsproxy.io/?${encodeURIComponent(urlAt)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(urlAt)}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent(urlAdd)}&disableCache=true`,
                `https://corsproxy.io/?${encodeURIComponent(urlAdd)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(urlClean)}`
            ];

            let anySuccess = false;

            // نشغل جميع الطلبات بالتوازي، وكلما وصل رد صحيح نفحص حداثة السنابات فيه فوراً
            const tasks = endpoints.map(async (ep) => {
                try {
                    const res = await fetch(ep, { cache: 'no-store' });
                    if (!res.ok) return;
                    let text = await res.text();

                    // إذا كان الرد من allorigins/get المغلف بـ JSON
                    if (text.startsWith('{"contents":')) {
                        const wrapped = JSON.parse(text);
                        text = wrapped.contents || '';
                    }

                    const match = text.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/i);
                    if (!match || !match[1]) return;

                    const json = JSON.parse(match[1]);
                    const pageProps = json?.props?.pageProps;
                    if (!pageProps) return;

                    const parsed = parsePageProps(pageProps);
                    anySuccess = true;

                    // نقارن بأحدث طابع زمني للسنابات (وليس العدد!) لضمان أخذ السنابات الجديدة دائماً
                    if (parsed.maxTimestamp >= bestTimestampLoaded || allItems.length === 0) {
                        bestTimestampLoaded = parsed.maxTimestamp;
                        applyParsedData(parsed);
                        document.getElementById('loadingBox').classList.add('hidden');
                        document.getElementById('liveIndicator').classList.remove('hidden');
                    }
                } catch (e) {}
            });

            await Promise.allSettled(tasks);

            document.getElementById('loadingBox').classList.add('hidden');
            setTimeout(() => icon.classList.remove('animate-spin'), 400);

            if (!anySuccess && allItems.length === 0) {
                document.getElementById('mediaGrid').innerHTML = `
                    <div class="col-span-2 py-12 px-4 text-center bg-zinc-900/50 rounded-2xl border border-white/10">
                        <p class="text-xs text-zinc-300 mb-3">تعذر جلب البيانات من الخادم حالياً، اضغط للتحديث الفوري.</p>
                        <button onclick="fetchLiveSnapData(true)" class="bg-[#FFFC00] text-black font-extrabold text-xs px-4 py-2 rounded-xl">تحديث الآن</button>
                    </div>
                `;
            }
        }

        function parsePageProps(props) {
            // دعم الحسابات العامة (publicProfileInfo) والحسابات العادية (userInfo) معاً
            const pub = props?.userProfile?.publicProfileInfo || props?.publicProfileInfo;
            const usr = props?.userProfile?.userInfo || props?.userInfo;
            const info = pub || usr || {};

            const name = info.title || info.displayName || username;
            const bio = info.bio || '';
            const avatar = info.profilePictureUrl 
                        || info.squareHeroImageUrl 
                        || info.bitmoji3d?.avatarImage?.url 
                        || info.snapcodeImageUrl 
                        || snapcodeUrl;
            const subs = info.subscriberCount ? `${(Number(info.subscriberCount) / 1000).toFixed(1)}K followers` : '';

            const items = [];
            const seen = new Set();
            let order = 0;
            let maxTimestamp = 1;

            function addSnap(snap, category, label, fallbackTs) {
                const urls = snap?.snapUrls || {};
                const mediaUrl = urls.mediaUrl || urls.mediaPreviewUrl?.value || snap?.mediaUrl;
                if (!mediaUrl || typeof mediaUrl !== 'string' || seen.has(mediaUrl)) return;
                seen.add(mediaUrl);

                const thumb = urls.mediaPreviewUrl?.value || snap?.thumbnailUrl?.value || mediaUrl;
                const isVideo = snap?.snapMediaType === 1 || mediaUrl.includes('.mp4') || (!mediaUrl.includes('.jpg') && !mediaUrl.includes('.png') && snap?.snapMediaType !== 0);
                const snapTs = snap?.timestampInSec?.value ? Number(snap.timestampInSec.value) * 1000 : fallbackTs;

                if (snapTs > maxTimestamp) maxTimestamp = snapTs;

                items.push({
                    id: `${category}_${order}`,
                    index: order++,
                    category,
                    type: isVideo ? 'video' : 'image',
                    url: mediaUrl,
                    thumb,
                    timestamp: snapTs,
                    timeAgo: formatTimeAgo(snap?.timestampInSec?.value),
                    title: label
                });
            }

            // 1. الستوري النشط (من كل المسارات الممكنة في سناب)
            const storySources = [
                props?.story?.snapList,
                props?.publicStory?.snapList,
                props?.userProfile?.publicProfileInfo?.story?.snapList,
                props?.userProfile?.userInfo?.story?.snapList
            ];
            storySources.forEach(list => {
                if (Array.isArray(list)) {
                    list.forEach((s, i) => addSnap(s, 'stories', `ستوري ${i + 1}`, Date.now() - (list.length - i) * 60000));
                }
            });

            // 2. القصص المحفوظة (القديمة)
            const highlights = props?.curatedHighlights || [];
            highlights.forEach((h, hi) => {
                const hTitle = h?.storyTitle?.value || `قصة ${hi + 1}`;
                (h?.snapList || []).forEach((s, si) => {
                    addSnap(s, 'highlights', `${hTitle} (${si + 1})`, Date.now() - (hi + 1) * 86400000);
                });
            });

            // 3. الأضواء (Spotlight)
            const spots = props?.spotlightHighlights || [];
            spots.forEach((sp, spi) => {
                (sp?.snapList || []).forEach((s) => {
                    addSnap(s, 'spotlight', `الأضواء #${spi + 1}`, Date.now() - (spi + 1) * 3600000);
                });
            });

            // 4. ماسح احتياطي إذا وضع سناب شات السنابات في كائن فرعي آخر
            if (items.length === 0) {
                (function scan(obj) {
                    if (!obj || typeof obj !== 'object') return;
                    if (obj.snapUrls?.mediaUrl) {
                        addSnap(obj, 'stories', `سناب ${order + 1}`, Date.now());
                        return;
                    }
                    Object.values(obj).forEach(scan);
                })(props);
            }

            return { name, bio, avatar, subs, items, maxTimestamp };
        }

        function formatTimeAgo(sec) {
            if (!sec) return 'حديثاً';
            const diffMin = Math.floor((Date.now() / 1000 - Number(sec)) / 60);
            if (diffMin < 1) return 'الآن';
            if (diffMin < 60) return `منذ ${diffMin} د`;
            const diffHr = Math.floor(diffMin / 60);
            if (diffHr < 24) return `منذ ${diffHr} س`;
            return `منذ ${Math.floor(diffHr / 24)} يوم`;
        }

        function applyParsedData(data) {
            document.getElementById('profileName').innerText = data.name;
            document.getElementById('vName').innerText = data.name;
            document.getElementById('profileBio').innerText = data.bio;
            document.getElementById('profileAvatar').src = data.avatar;
            document.getElementById('vAvatar').src = data.avatar;
            document.getElementById('profileSub').innerText = data.subs ? `@${username} • ${data.subs}` : `@${username}`;

            allItems = data.items;
            activeStories = allItems.filter(i => i.category === 'stories').sort((a, b) => a.index - b.index);

            const stCount = activeStories.length;
            const hlCount = allItems.filter(i => i.category === 'highlights').length;
            const spCount = allItems.filter(i => i.category === 'spotlight').length;

            document.getElementById('activeCountBadge').innerText = stCount || allItems.length;
            document.getElementById('cStories').innerText = stCount;
            document.getElementById('cHighlights').innerText = hlCount;
            document.getElementById('cSpot').innerText = spCount;
            document.getElementById('cAll').innerText = allItems.length;

            // إذا لم يكن هناك ستوري نشط اليوم ولكن يوجد أرشيف/أضواء، نفتح تبويب الكل تلقائياً
            if (stCount === 0 && allItems.length > 0 && currentTab === 'stories') {
                currentTab = 'all';
                ['stories', 'highlights', 'spotlight', 'all'].forEach(t => {
                    document.getElementById(`tab-${t}`).classList.toggle('tab-active', t === 'all');
                });
            }

            // إعداد بطاقة معاينة آخر سنابة وتحميل أول سنابة مسبقاً بالذاكرة لفتحها في 0 ثانية!
            const pool = stCount > 0 ? activeStories : allItems;
            const featSec = document.getElementById('featuredSection');

            if (pool.length > 0) {
                const latest = pool[pool.length - 1];
                const oldest = pool[0];
                document.getElementById('featuredBadge').innerText = `Snaps: ${pool.length}`;
                document.getElementById('lastSyncTime').innerText = `آخر سنابة: ${latest.timeAgo}`;
                featSec.classList.remove('hidden');

                const fImg = document.getElementById('featuredThumb');
                const fVid = document.getElementById('featuredVid');
                if (latest.thumb && latest.thumb !== latest.url) {
                    fVid.classList.add('hidden');
                    fImg.classList.remove('hidden');
                    fImg.src = latest.thumb;
                } else if (latest.type === 'video') {
                    fImg.classList.add('hidden');
                    fVid.classList.remove('hidden');
                    fVid.src = `${latest.url}#t=0.1`;
                } else {
                    fVid.classList.add('hidden');
                    fImg.classList.remove('hidden');
                    fImg.src = latest.url;
                }

                // تحميل مسبق لأول سنابة في القصة لكي تعمل فور الضغط بدون أي انتظار
                if (oldest.type === 'video') {
                    document.getElementById('preloadV1').src = oldest.url;
                }
            } else {
                featSec.classList.add('hidden');
                document.getElementById('lastSyncTime').innerText = 'لا يوجد ستوري نشط خلال 24 ساعة';
            }

            renderGrid();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['stories', 'highlights', 'spotlight', 'all'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('tab-active', t === tab);
            });
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('mediaGrid');
            const sort = document.getElementById('sortSelect').value;

            gridItems = allItems.filter(i => currentTab === 'all' || i.category === currentTab);
            gridItems.sort((a, b) => sort === 'oldest' ? a.index - b.index : b.index - a.index);

            grid.innerHTML = '';

            if (gridItems.length === 0) {
                grid.innerHTML = `<div class="col-span-2 py-12 text-center text-zinc-500 text-xs">لا توجد سنابات في هذا القسم حالياً</div>`;
                return;
            }

            gridItems.forEach((item, idx) => {
                const isSel = selectedIds.has(item.id);
                const card = document.createElement('div');
                card.className = `relative aspect-[9/16] rounded-2xl overflow-hidden bg-zinc-900 border ${isSel ? 'border-2 border-[#FFFC00] scale-[0.96]' : 'border-white/10'} cursor-pointer`;
                
                card.onclick = () => isSelectMode ? toggleSelect(item.id) : openViewer(gridItems, idx);

                const useImg = (item.thumb && item.thumb !== item.url) || item.type === 'image';
                card.innerHTML = `
                    ${useImg 
                        ? `<img src="${item.thumb || item.url}" loading="lazy" class="w-full h-full object-cover pointer-events-none">`
                        : `<video src="${item.url}#t=0.1" preload="metadata" muted playsinline class="w-full h-full object-cover pointer-events-none"></video>`
                    }
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40"></div>
                    <div class="absolute top-2 right-2 left-2 flex justify-between items-center">
                        <span class="bg-black/70 text-[10px] font-bold px-2 py-0.5 rounded text-white">${item.timeAgo}</span>
                        ${isSelectMode 
                            ? `<div class="w-6 h-6 rounded-full flex items-center justify-center ${isSel ? 'bg-[#FFFC00] text-black' : 'bg-black/60 border border-white/50 text-transparent'}"><i class="fa-solid fa-check text-xs"></i></div>`
                            : `<span class="text-white text-xs drop-shadow"><i class="fa-solid ${item.type === 'video' ? 'fa-play' : 'fa-image'}"></i></span>`
                        }
                    </div>
                    <div class="absolute bottom-2 inset-x-2 flex justify-between items-center">
                        <span class="text-[10px] font-bold text-zinc-200 truncate">${item.title}</span>
                        <button onclick="event.stopPropagation(); downloadSingle('${item.url}', '${username}_${item.id}.${item.type === 'video' ? 'mp4' : 'jpg'}', this)" 
                            class="w-8 h-8 bg-[#FFFC00] text-black rounded-lg flex items-center justify-center active:scale-90">
                            <i class="fa-solid fa-download text-xs"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // =========================================================================
        // مشغل السناب فائق السرعة (اتجاه التقدم والضغط من اليسار إلى اليمين LTR)
        // =========================================================================
        function playAllFromOldest() {
            const queue = activeStories.length > 0 ? activeStories : allItems;
            if (queue.length > 0) openViewer(queue, 0);
        }

        function openViewer(queue, startIndex) {
            viewerQueue = queue;
            vIndex = startIndex;
            const viewer = document.getElementById('storyViewer');
            viewer.classList.remove('hidden');
            viewer.style.transform = 'translateY(0)';
            showSnap(vIndex);
        }

        function showSnap(idx) {
            clearTimeout(imgTimer);
            const vEl = document.getElementById('vPlayer');
            const iEl = document.getElementById('iPlayer');
            const pre1 = document.getElementById('preloadV1');
            const pre2 = document.getElementById('preloadV2');
            vEl.pause();

            if (idx < 0) idx = 0;
            if (idx >= viewerQueue.length) {
                closeViewer();
                return;
            }

            vIndex = idx;
            const item = viewerQueue[idx];

            // رسم أشرطة التقدم من اليسار لليمين (LTR)
            const bars = document.getElementById('viewerBars');
            bars.innerHTML = viewerQueue.map((_, i) => `
                <div class="h-[2.5px] flex-1 rounded-full bg-white/30 overflow-hidden" dir="ltr">
                    <div id="bar-${i}" class="h-full bg-white transition-all duration-75" style="width:${i < idx ? '100%' : '0%'}"></div>
                </div>
            `).join('');

            document.getElementById('vTime').innerText = `${item.title} • ${item.timeAgo}`;
            document.getElementById('vCounter').innerText = `${idx + 1} / ${viewerQueue.length}`;

            if (item.type === 'video') {
                iEl.classList.add('hidden');
                vEl.classList.remove('hidden');
                vEl.src = item.url;
                vEl.currentTime = 0;
                vEl.play().catch(() => {});

                vEl.ontimeupdate = () => {
                    if (vEl.duration) {
                        const pct = (vEl.currentTime / vEl.duration) * 100;
                        const b = document.getElementById(`bar-${idx}`);
                        if (b) b.style.width = `${pct}%`;
                    }
                };
                vEl.onended = () => nextSnap();
            } else {
                vEl.classList.add('hidden');
                iEl.classList.remove('hidden');
                iEl.src = item.url;
                const b = document.getElementById(`bar-${idx}`);
                if (b) b.style.width = '100%';
                imgTimer = setTimeout(() => nextSnap(), 4000);
            }

            // تحميل مسبق للسنابتين القادمتين في الخلفية لفتح فوري بدون تقطيع
            [viewerQueue[idx + 1], viewerQueue[idx + 2]].forEach((nxt, nIdx) => {
                if (!nxt) return;
                if (nxt.type === 'video') {
                    const targetPre = nIdx === 0 ? pre1 : pre2;
                    if (targetPre.src !== nxt.url) {
                        targetPre.src = nxt.url;
                        targetPre.load();
                    }
                } else {
                    const img = new Image();
                    img.src = nxt.url;
                }
            });
        }

        function nextSnap() { showSnap(vIndex + 1); }
        function prevSnap() { showSnap(vIndex - 1); }

        function closeViewer() {
            clearTimeout(imgTimer);
            const vEl = document.getElementById('vPlayer');
            vEl.pause();
            vEl.src = '';
            document.getElementById('storyViewer').classList.add('hidden');
        }

        // التحكم باللمس: يمين الشاشة = السنابة التالية | يسار الشاشة = السنابة السابقة (من اليسار لليمين)
        const stage = document.getElementById('storyMediaStage');
        const viewer = document.getElementById('storyViewer');

        stage.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            startTime = Date.now();

            holdTimer = setTimeout(() => {
                isPaused = true;
                viewer.classList.add('viewer-holding');
                const v = document.getElementById('vPlayer');
                if (!v.classList.contains('hidden')) v.pause();
                clearTimeout(imgTimer);
            }, 200);
        }, { passive: true });

        stage.addEventListener('touchmove', (e) => {
            const dy = e.touches[0].clientY - startY;
            if (dy > 25 && !isPaused) {
                clearTimeout(holdTimer);
                viewer.style.transform = `translateY(${dy}px)`;
            }
        }, { passive: true });

        stage.addEventListener('touchend', (e) => {
            clearTimeout(holdTimer);
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            const dt = Date.now() - startTime;

            if (isPaused) {
                isPaused = false;
                viewer.classList.remove('viewer-holding');
                const v = document.getElementById('vPlayer');
                if (!v.classList.contains('hidden')) v.play().catch(() => {});
                else imgTimer = setTimeout(() => nextSnap(), 2500);
                return;
            }

            if (dy > 100) {
                closeViewer();
                return;
            }
            viewer.style.transform = 'translateY(0)';

            // النقر السريع: اليمين للتالي، اليسار للسابق
            if (dt < 260 && Math.abs(dx) < 30 && Math.abs(dy) < 30) {
                if (startX > window.innerWidth * 0.32) {
                    nextSnap(); // ضغط على اليمين أو الوسط -> السنابة التالية
                } else {
                    prevSnap(); // ضغط على اليسار -> السنابة السابقة
                }
            }
        });

        stage.addEventListener('click', (e) => {
            if ('ontouchstart' in window) return;
            if (e.clientX > window.innerWidth * 0.32) nextSnap();
            else prevSnap();
        });

        // =========================================================================
        // التحميل والدمج الخفيف مع الصوت
        // =========================================================================
        async function fetchBlob(url, isVideo = true) {
            const list = [url, `https://corsproxy.io/?${encodeURIComponent(url)}`];
            for (const ep of list) {
                try {
                    const r = await fetch(ep);
                    if (!r.ok) continue;
                    const buf = await r.arrayBuffer();
                    if (buf.byteLength > 1000) return new Blob([buf], { type: isVideo ? 'video/mp4' : 'image/jpeg' });
                } catch (e) {}
            }
            return null;
        }

        async function downloadSingle(url, name, btn = null) {
            const old = btn ? btn.innerHTML : '';
            if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-xs"></i>';
            try {
                const blob = await fetchBlob(url, name.endsWith('.mp4'));
                const a = document.createElement('a');
                a.href = blob ? URL.createObjectURL(blob) : url;
                a.download = name;
                a.target = '_blank';
                a.click();
            } finally {
                if (btn) btn.innerHTML = old;
            }
        }

        function downloadCurrentInViewer() {
            const it = viewerQueue[vIndex];
            if (it) downloadSingle(it.url, `${username}_${it.id}.${it.type === 'video' ? 'mp4' : 'jpg'}`);
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            selectedIds.clear();
            document.getElementById('selectModeBtn').innerText = isSelectMode ? 'إلغاء' : 'تحديد ودمج';
            document.getElementById('selectAllBtn').classList.toggle('hidden', !isSelectMode);
            updateMergeUI();
            renderGrid();
        }

        function toggleSelect(id) {
            selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
            updateMergeUI();
            renderGrid();
        }

        function selectAllVisible() {
            gridItems.forEach(i => selectedIds.add(i.id));
            updateMergeUI();
            renderGrid();
        }

        function updateMergeUI() {
            document.getElementById('selCount').innerText = selectedIds.size;
            const bar = document.getElementById('mergeBar');
            bar.classList.toggle('hidden', !(isSelectMode && selectedIds.size > 0));
            bar.classList.toggle('flex', isSelectMode && selectedIds.size > 0);
        }

        async function downloadSelectedSeparate() {
            for (const it of gridItems.filter(i => selectedIds.has(i.id))) {
                await downloadSingle(it.url, `${username}_${it.id}.${it.type === 'video' ? 'mp4' : 'jpg'}`);
            }
        }

        async function mergeSelectedWithAudio() {
            const list = gridItems.filter(i => selectedIds.has(i.id)).sort((a, b) => a.index - b.index);
            if (!list.length) return;

            const btn = document.getElementById('mergeBtn');
            const wrap = document.getElementById('progWrap');
            const fill = document.getElementById('progFill');
            const pctTxt = document.getElementById('progPct');
            const lbl = document.getElementById('progLabel');

            btn.disabled = true;
            wrap.classList.remove('hidden');
            wrap.classList.add('flex');

            const setProg = (p, t) => {
                const v = Math.min(100, Math.round(p));
                fill.style.width = `${v}%`;
                pctTxt.innerText = `${v}%`;
                if (t) lbl.innerText = t;
            };

            try {
                const blobs = [];
                for (let i = 0; i < list.length; i++) {
                    setProg((i / list.length) * 40, `سحب المقطع (${i + 1}/${list.length})...`);
                    const b = await fetchBlob(list[i].url, list[i].type === 'video');
                    if (b) blobs.push({ blob: b, type: list[i].type });
                }

                const canvas = document.getElementById('mergeCanvas');
                const ctx = canvas.getContext('2d');
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                const dest = audioCtx.createMediaStreamDestination();

                const stream = new MediaStream([
                    ...canvas.captureStream(30).getVideoTracks(),
                    ...dest.stream.getAudioTracks()
                ]);

                const mime = ['video/mp4', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
                const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 2500000 } : {});
                const chunks = [];
                rec.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };
                const done = new Promise(r => rec.onstop = r);

                rec.start();

                for (let i = 0; i < blobs.length; i++) {
                    const url = URL.createObjectURL(blobs[i].blob);
                    await new Promise(res => {
                        const v = document.createElement('video');
                        v.src = url;
                        v.playsInline = true;
                        v.onloadedmetadata = () => {
                            try { audioCtx.createMediaElementSource(v).connect(dest); } catch (e) {}
                            v.play().catch(() => res());
                        };
                        v.ontimeupdate = () => {
                            if (v.duration) {
                                const p = 40 + ((i + v.currentTime / v.duration) / blobs.length) * 60;
                                setProg(p, `دمج الصوت والفيديو (${i + 1}/${blobs.length})...`);
                            }
                        };
                        const draw = () => {
                            if (!v.paused && !v.ended) {
                                ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
                                requestAnimationFrame(draw);
                            }
                        };
                        v.onplay = draw;
                        v.onended = res;
                        v.onerror = res;
                    });
                    URL.revokeObjectURL(url);
                }

                rec.stop();
                await done;
                audioCtx.close().catch(() => {});

                setProg(100, 'اكتمل الدمج 100%!');
                const finalBlob = new Blob(chunks, { type: 'video/mp4' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(finalBlob);
                a.download = `${username}_merged_${Date.now()}.mp4`;
                a.click();
            } catch (e) {
                await downloadSelectedSeparate();
            } finally {
                btn.disabled = false;
                setTimeout(() => wrap.classList.add('hidden'), 3000);
            }
        }

        fetchLiveSnapData(false);
    </script>
