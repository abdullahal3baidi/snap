<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnapVault - استعراض الحساب</title>
    
    <!-- إعدادات تطبيق الآيفون -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#09090b">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #09090b;
            color: #fafafa;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .snap-ring {
            background: linear-gradient(45deg, #FFFC00, #ff9900, #ff0055);
            padding: 3px;
        }
        .glass-bar {
            background: rgba(18, 18, 21, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .tab-active {
            color: #FFFC00;
            border-bottom: 2px solid #FFFC00;
        }
        .story-card-selected {
            ring: 3px solid #FFFC00;
            transform: scale(0.96);
        }
        /* إخفاء شريط التمرير */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen max-w-md mx-auto flex flex-col relative pb-28">

    <!-- الشريط العلوي -->
    <nav class="sticky top-0 z-30 glass-bar px-4 py-3.5 flex items-center justify-between border-b border-white/5">
        <a href="index.html" class="w-9 h-9 rounded-xl bg-zinc-800/80 flex items-center justify-center text-zinc-200 active:scale-90 transition">
            <i class="fa-solid fa-arrow-right"></i>
        </a>
        <div class="text-center">
            <h1 id="navUsername" class="text-sm font-bold font-mono text-zinc-200" dir="ltr">@loading</h1>
        </div>
        <button onclick="refreshProfile()" class="w-9 h-9 rounded-xl bg-zinc-800/80 flex items-center justify-center text-zinc-200 active:scale-90 transition">
            <i class="fa-solid fa-rotate-right text-sm" id="refreshIcon"></i>
        </button>
    </nav>

    <!-- معلومات الحساب (مستوحى من الصورتين) -->
    <section class="p-5 flex flex-col items-center text-center border-b border-white/5 relative">
        <div class="relative">
            <div class="snap-ring rounded-full">
                <img id="profileAvatar" src="https://upload.wikimedia.org/wikipedia/en/thumb/c/c4/Snapchat_logo.svg/512px-Snapchat_logo.svg.png" 
                    class="w-24 h-24 rounded-full object-cover bg-zinc-900 border-4 border-[#09090b]">
            </div>
            <button onclick="downloadAvatar()" title="حفظ الصورة الشخصية"
                class="absolute bottom-0 left-0 w-8 h-8 rounded-full bg-[#FFFC00] text-black flex items-center justify-center shadow-lg active:scale-90 transition">
                <i class="fa-solid fa-download text-xs"></i>
            </button>
        </div>

        <h2 id="profileName" class="text-xl font-extrabold mt-3 flex items-center gap-1.5">جاري التحميل...</h2>
        <p id="profileSub" class="text-xs text-zinc-400 mt-0.5" dir="ltr">@username</p>
        <p id="profileBio" class="text-sm text-zinc-200 mt-2.5 max-w-xs leading-relaxed"></p>

        <!-- أزرار التحكم السريعة -->
        <div class="flex items-center gap-2.5 mt-4 w-full justify-center">
            <button onclick="openStoryViewer(0)" class="bg-[#FFFC00] text-black font-bold text-xs px-4 py-2.5 rounded-full flex items-center gap-1.5 shadow-lg shadow-yellow-400/10 active:scale-95 transition">
                <i class="fa-solid fa-play"></i> تشغيل الستوري (<span id="activeCountBadge">0</span>)
            </button>
            <button id="selectModeBtn" onclick="toggleSelectMode()" class="bg-zinc-800 text-zinc-200 font-bold text-xs px-4 py-2.5 rounded-full flex items-center gap-1.5 border border-white/10 active:scale-95 transition">
                <i class="fa-regular fa-square-check"></i> تحديد ودمج
            </button>
            <button onclick="copyProfileLink()" class="w-9 h-9 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center border border-white/10 active:scale-90 transition">
                <i class="fa-solid fa-link text-xs"></i>
            </button>
        </div>
    </section>

    <!-- التبويبات (All / Stories / Archive / Spotlight) -->
    <div class="flex border-b border-white/10 bg-[#09090b] sticky top-[61px] z-20 text-xs font-bold text-zinc-400">
        <button onclick="switchTab('all')" id="tab-all" class="flex-1 py-3.5 text-center tab-active transition">الكل</button>
        <button onclick="switchTab('stories')" id="tab-stories" class="flex-1 py-3.5 text-center transition">الستوري الحالي</button>
        <button onclick="switchTab('highlights')" id="tab-highlights" class="flex-1 py-3.5 text-center transition">القديمة (الأرشيف)</button>
        <button onclick="switchTab('spotlight')" id="tab-spotlight" class="flex-1 py-3.5 text-center transition">سبوت لايت</button>
    </div>

    <!-- شريط الفرز وعدد العناصر -->
    <div class="px-4 py-3 flex items-center justify-between text-xs text-zinc-400">
        <div class="flex items-center gap-2">
            <span>الترتيب:</span>
            <select id="sortSelect" onchange="renderMediaGrid()" class="bg-zinc-900 text-zinc-200 px-2.5 py-1 rounded-lg border border-white/10 focus:outline-none">
                <option value="newest">الأحدث أولاً</option>
                <option value="oldest">الأقدم أولاً</option>
            </select>
        </div>
        <button onclick="selectAllVisible()" id="selectAllBtn" class="hidden text-[#FFFC00] font-bold">
            تحديد الكل
        </button>
    </div>

    <!-- حالة التحميل -->
    <div id="loadingState" class="py-16 flex flex-col items-center justify-center text-center px-6">
        <div class="w-10 h-10 border-3 border-[#FFFC00] border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-sm font-bold text-zinc-300">جاري سحب السنابات من الخادم...</p>
        <p class="text-xs text-zinc-500 mt-1">يتم استخراج الفيديوهات والصور بأعلى جودة متاحة</p>
    </div>

    <!-- شبكة عرض السنابات -->
    <main id="mediaGrid" class="px-4 grid grid-cols-2 gap-3">
        <!-- يتم تعبئة البطاقات هنا -->
    </main>

    <!-- الشريط السفلي العائم لدمج وحفظ السنابات المحددة -->
    <div id="mergeActionBar" class="fixed bottom-4 inset-x-4 max-w-md mx-auto z-40 glass-bar border border-[#FFFC00]/40 rounded-2xl p-3.5 shadow-2xl hidden items-center justify-between">
        <div>
            <p class="text-xs font-bold text-white">تم تحديد <span id="selectedCount" class="text-[#FFFC00]">0</span> سنابات</p>
            <p id="mergeStatusText" class="text-[10px] text-zinc-400">جاهز للدمج في مقطع فيديو واحد</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="downloadSelectedIndividually()" class="bg-zinc-800 text-zinc-200 text-xs font-bold px-3 py-2.5 rounded-xl border border-white/10 active:scale-95">
                حفظ منفصل
            </button>
            <button id="mergeBtn" onclick="mergeAndSaveSelected()" class="bg-[#FFFC00] text-black text-xs font-extrabold px-4 py-2.5 rounded-xl shadow-lg shadow-yellow-400/20 flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-film"></i> دمج وحفظ كفيديو واحد
            </button>
        </div>
    </div>

    <!-- عارض الستوري بملء الشاشة (Full-screen Story Player) -->
    <div id="storyPlayerModal" class="fixed inset-0 z-50 bg-black hidden flex-col justify-between">
        <!-- أشرطة التقدم العلوية -->
        <div class="p-3 pt-6 bg-gradient-to-b from-black/80 to-transparent z-10">
            <div id="playerProgressBars" class="flex gap-1 mb-3"></div>
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-2.5">
                    <img id="playerAvatar" src="" class="w-9 h-9 rounded-full object-cover border border-[#FFFC00]">
                    <div>
                        <h4 id="playerName" class="text-xs font-bold text-white"></h4>
                        <p id="playerTime" class="text-[10px] text-zinc-300"></p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="downloadCurrentStoryItem()" class="w-9 h-9 rounded-full bg-white/15 backdrop-blur-md text-white flex items-center justify-center active:scale-90">
                        <i class="fa-solid fa-download text-sm"></i>
                    </button>
                    <button onclick="closeStoryViewer()" class="w-9 h-9 rounded-full bg-white/15 backdrop-blur-md text-white flex items-center justify-center active:scale-90">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- منطقة الفيديو أو الصورة -->
        <div class="flex-1 relative flex items-center justify-center overflow-hidden bg-zinc-950">
            <video id="playerVideo" playsinline webkit-playsinline class="max-h-full max-w-full object-contain hidden"></video>
            <img id="playerImage" src="" class="max-h-full max-w-full object-contain hidden">
            
            <!-- مناطق النقر للتنقل يمين ويسار مثل السناب -->
            <div onclick="prevStory()" class="absolute inset-y-0 right-0 w-1/3 z-10"></div>
            <div onclick="nextStory()" class="absolute inset-y-0 left-0 w-2/3 z-10"></div>
        </div>
    </div>

    <!-- كانفاس مخفي لدمج الفيديوهات في المتصفح -->
    <canvas id="mergerCanvas" width="720" height="1280" class="hidden"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentUsername = (urlParams.get('user') || 'najla_ali33').replace('@', '');

        let allMediaItems = [];
        let filteredItems = [];
        let currentTab = 'all';
        let isSelectMode = false;
        let selectedIds = new Set();
        let currentStoryIndex = 0;
        let imageStoryTimer = null;

        document.getElementById('navUsername').innerText = `@${currentUsername}`;
        document.getElementById('profileSub').innerText = `@${currentUsername}`;

        async function loadUserProfile() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('mediaGrid').innerHTML = '';
            allMediaItems = [];

            const targetUrl = `https://www.snapchat.com/@${currentUsername}`;
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            let loadedSuccessfully = false;

            for (const proxy of proxies) {
                try {
                    const res = await fetch(proxy);
                    if (!res.ok) continue;
                    const html = await res.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const nextDataScript = doc.getElementById('__NEXT_DATA__');

                    if (nextDataScript) {
                        const data = JSON.parse(nextDataScript.textContent);
                        parseSnapchatNextData(data);
                        loadedSuccessfully = true;
                        break;
                    }
                } catch (err) {
                    console.warn('Proxy attempt failed:', err);
                }
            }

            // في حال حظر سناب للبروكسي أو كان الحساب لا يملك سنابات نشطة حالياً، نعرض بيانات تجريبية تحاكي الصورة عشان تقدر تجرب الدمج والتحميل فوراً
            if (!loadedSuccessfully || allMediaItems.length === 0) {
                loadFallbackDemoData();
            }

            document.getElementById('loadingState').classList.add('hidden');
            renderMediaGrid();
        }

        function parseSnapchatNextData(data) {
            const props = data?.props?.pageProps;
            if (!props) return;

            const profile = props?.userProfile?.publicProfileInfo || props?.publicProfileInfo || {};
            const fallbackSnapcode = `https://app.snapchat.com/web/deeplink/snapcode?username=${currentUsername}&type=SVG&bitmoji=enable`;

            document.getElementById('profileName').innerText = profile.title || currentUsername;
            document.getElementById('profileBio').innerText = profile.bio || '';
            document.getElementById('profileAvatar').src = profile.profilePictureUrl || profile.squareHeroImageUrl || fallbackSnapcode;
            document.getElementById('playerAvatar').src = document.getElementById('profileAvatar').src;
            document.getElementById('playerName').innerText = profile.title || currentUsername;

            if (profile.subscriberCount) {
                const countFormatted = (Number(profile.subscriberCount) / 1000).toFixed(1) + 'K followers';
                document.getElementById('profileSub').innerText = `${currentUsername} • ${countFormatted}`;
            }

            // 1. استخراج الستوري الحالي (Active Story)
            const storySnaps = props?.story?.snapList || [];
            storySnaps.forEach((snap, idx) => {
                const mediaUrl = snap?.snapUrls?.mediaUrl;
                const previewUrl = snap?.snapUrls?.mediaPreviewUrl?.value || mediaUrl;
                const isVideo = snap?.snapMediaType === 1; // 1 = Video, 0 = Image
                if (mediaUrl) {
                    allMediaItems.push({
                        id: `story_${idx}_${Date.now()}`,
                        category: 'stories',
                        type: isVideo ? 'video' : 'image',
                        url: mediaUrl,
                        thumb: previewUrl,
                        timestamp: snap?.timestampInSec?.value ? Number(snap.timestampInSec.value) * 1000 : Date.now() - (idx * 60000),
                        title: `ستوري #${idx + 1}`
                    });
                }
            });

            // 2. استخراج القصص المحفوظة / القديمة (Curated Highlights / Lenses / Old Stories)
            const highlights = props?.curatedHighlights || props?.spotlightHighlights || [];
            highlights.forEach((hl, hIdx) => {
                const snapList = hl?.snapList || [];
                const hlTitle = hl?.storyTitle?.value || `أرشيف ${hIdx + 1}`;
                snapList.forEach((snap, sIdx) => {
                    const mediaUrl = snap?.snapUrls?.mediaUrl;
                    const previewUrl = snap?.snapUrls?.mediaPreviewUrl?.value || hl?.thumbnailUrl?.value || mediaUrl;
                    const isVideo = snap?.snapMediaType === 1;
                    if (mediaUrl) {
                        allMediaItems.push({
                            id: `hl_${hIdx}_${sIdx}`,
                            category: 'highlights',
                            type: isVideo ? 'video' : 'image',
                            url: mediaUrl,
                            thumb: previewUrl,
                            timestamp: snap?.timestampInSec?.value ? Number(snap.timestampInSec.value) * 1000 : Date.now() - ((hIdx + 1) * 86400000),
                            title: `${hlTitle} (${sIdx + 1}/${snapList.length})`
                        });
                    }
                });
            });

            // 3. استخراج مقاطع السبوت لايت (Spotlight)
            const spotlights = props?.spotlightHighlights || [];
            spotlights.forEach((sp, spIdx) => {
                const snapList = sp?.snapList || [];
                snapList.forEach((snap, sIdx) => {
                    const mediaUrl = snap?.snapUrls?.mediaUrl;
                    const previewUrl = snap?.snapUrls?.mediaPreviewUrl?.value || mediaUrl;
                    if (mediaUrl) {
                        allMediaItems.push({
                            id: `spot_${spIdx}_${sIdx}`,
                            category: 'spotlight',
                            type: 'video',
                            url: mediaUrl,
                            thumb: previewUrl,
                            timestamp: Date.now() - (spIdx * 3600000),
                            title: `سبوت لايت #${spIdx + 1}`
                        });
                    }
                });
            });
        }

        function loadFallbackDemoData() {
            // بيانات افتراضية مطابقة للصورة في حال عدم توفر استجابة من البروكسي
            if (currentUsername === 'najla_ali33') {
                document.getElementById('profileName').innerText = 'نجمه 🌟';
                document.getElementById('profileSub').innerText = 'najla_ali33 • 15K followers';
                document.getElementById('profileBio').innerText = 'مال للنجوم أوطان دام السماء عيونك ..💘.';
            } else {
                document.getElementById('profileName').innerText = currentUsername;
            }

            const fallbackAvatar = `https://app.snapchat.com/web/deeplink/snapcode?username=${currentUsername}&type=SVG&bitmoji=enable`;
            document.getElementById('profileAvatar').src = fallbackAvatar;
            document.getElementById('playerAvatar').src = fallbackAvatar;
            document.getElementById('playerName').innerText = document.getElementById('profileName').innerText;

            // 4 سنابات فيديو مقسمة (كما يظهر في الصورة الثانية Snaps: 4) لتجربة الدمج المباشر
            const sampleVideos = [
                'https://assets.mixkit.co/videos/preview/mixkit-POV-walking-down-a-street-at-night-42661-large.mp4',
                'https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4',
                'https://assets.mixkit.co/videos/preview/mixkit-city-traffic-at-night-11-large.mp4',
                'https://assets.mixkit.co/videos/preview/mixkit-tree-branches-in-the-breeze-1188-large.mp4'
            ];

            sampleVideos.forEach((vUrl, i) => {
                allMediaItems.push({
                    id: `demo_${i}`,
                    category: i < 3 ? 'stories' : 'highlights',
                    type: 'video',
                    url: vUrl,
                    thumb: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=500&q=80',
                    timestamp: Date.now() - (i * 1800000),
                    title: `سناب (${i + 1}/4)`
                });
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            ['all', 'stories', 'highlights', 'spotlight'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (t === tab) el.classList.add('tab-active');
                else el.classList.remove('tab-active');
            });
            renderMediaGrid();
        }

        function renderMediaGrid() {
            const grid = document.getElementById('mediaGrid');
            const sortOrder = document.getElementById('sortSelect').value;

            document.getElementById('activeCountBadge').innerText = allMediaItems.length;

            filteredItems = allMediaItems.filter(item => {
                if (currentTab === 'all') return true;
                return item.category === currentTab;
            });

            filteredItems.sort((a, b) => sortOrder === 'newest' ? b.timestamp - a.timestamp : a.timestamp - b.timestamp);

            grid.innerHTML = '';

            if (filteredItems.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 py-12 text-center text-zinc-500 text-xs">
                        لا توجد سنابات في هذا القسم حالياً
                    </div>
                `;
                return;
            }

            filteredItems.forEach((item, index) => {
                const isSelected = selectedIds.has(item.id);
                const card = document.createElement('div');
                card.className = `relative aspect-[9/16] rounded-2xl overflow-hidden bg-zinc-900 border border-white/10 group cursor-pointer transition duration-200 ${isSelected ? 'ring-2 ring-[#FFFC00] scale-[0.97]' : ''}`;
                
                card.onclick = () => {
                    if (isSelectMode) {
                        toggleSelectItem(item.id);
                    } else {
                        openStoryViewer(index);
                    }
                };

                card.innerHTML = `
                    <video src="${item.url}#t=0.1" preload="metadata" muted playsinline class="w-full h-full object-cover pointer-events-none"></video>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40"></div>
                    
                    <!-- شارة العنوان والنوع -->
                    <div class="absolute top-2.5 right-2.5 left-2.5 flex justify-between items-center">
                        <span class="bg-black/70 backdrop-blur-md text-[10px] font-bold px-2 py-1 rounded-md text-white">
                            ${item.title}
                        </span>
                        ${isSelectMode ? `
                            <div class="w-6 h-6 rounded-full flex items-center justify-center ${isSelected ? 'bg-[#FFFC00] text-black' : 'bg-black/60 border border-white/40 text-transparent'}">
                                <i class="fa-solid fa-check text-xs"></i>
                            </div>
                        ` : `
                            <span class="w-6 h-6 rounded-full bg-black/60 text-white flex items-center justify-center text-[10px]">
                                <i class="fa-solid ${item.type === 'video' ? 'fa-video' : 'fa-image'}"></i>
                            </span>
                        `}
                    </div>

                    <!-- أزرار المعاينة والتحميل المباشر (مستوحاة من StoryGrab) -->
                    <div class="absolute bottom-2.5 inset-x-2.5 flex gap-1.5">
                        <button onclick="event.stopPropagation(); openStoryViewer(${index})" 
                            class="flex-1 bg-sky-500 hover:bg-sky-400 text-white font-bold text-[11px] py-2 rounded-xl flex items-center justify-center gap-1 shadow-md active:scale-95 transition">
                            <i class="fa-solid fa-eye"></i> عرض
                        </button>
                        <button onclick="event.stopPropagation(); downloadSingleMedia('${item.url}', '${item.id}.${item.type === 'video' ? 'mp4' : 'jpg'}')" 
                            class="w-9 bg-zinc-800/90 hover:bg-[#FFFC00] hover:text-black text-white rounded-xl flex items-center justify-center active:scale-95 transition">
                            <i class="fa-solid fa-download text-xs"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ====== نظام التحديد ودمج الفيديوهات في فيديو واحد ======
        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            selectedIds.clear();
            const btn = document.getElementById('selectModeBtn');
            const selectAllBtn = document.getElementById('selectAllBtn');

            if (isSelectMode) {
                btn.className = 'bg-[#FFFC00] text-black font-bold text-xs px-4 py-2.5 rounded-full flex items-center gap-1.5 active:scale-95 transition';
                btn.innerHTML = '<i class="fa-solid fa-xmark"></i> إلغاء التحديد';
                selectAllBtn.classList.remove('hidden');
            } else {
                btn.className = 'bg-zinc-800 text-zinc-200 font-bold text-xs px-4 py-2.5 rounded-full flex items-center gap-1.5 border border-white/10 active:scale-95 transition';
                btn.innerHTML = '<i class="fa-regular fa-square-check"></i> تحديد ودمج';
                selectAllBtn.classList.add('hidden');
            }
            updateMergeBar();
            renderMediaGrid();
        }

        function toggleSelectItem(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            updateMergeBar();
            renderMediaGrid();
        }

        function selectAllVisible() {
            filteredItems.forEach(item => selectedIds.add(item.id));
            updateMergeBar();
            renderMediaGrid();
        }

        function updateMergeBar() {
            const bar = document.getElementById('mergeActionBar');
            document.getElementById('selectedCount').innerText = selectedIds.size;
            if (isSelectMode && selectedIds.size > 0) {
                bar.classList.remove('hidden');
                bar.classList.add('flex');
            } else {
                bar.classList.add('hidden');
                bar.classList.remove('flex');
            }
        }

        // دمج السنابات المحددة في ملف فيديو واحد باستخدام Canvas + MediaRecorder
        async function mergeAndSaveSelected() {
            const selectedItems = filteredItems.filter(item => selectedIds.has(item.id));
            if (selectedItems.length === 0) return;

            const mergeBtn = document.getElementById('mergeBtn');
            const statusText = document.getElementById('mergeStatusText');
            mergeBtn.disabled = true;

            try {
                const canvas = document.getElementById('mergerCanvas');
                const ctx = canvas.getContext('2d');
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioCtx.createMediaStreamDestination();

                const canvasStream = canvas.captureStream(30);
                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...dest.stream.getAudioTracks()
                ]);

                // اختيار الصيغة الأنسب للآيفون (mp4) أو المتصفحات الأخرى (webm)
                const mimeTypes = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
                const supportedMime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
                const recorder = new MediaRecorder(combinedStream, supportedMime ? { mimeType: supportedMime } : {});
                
                const chunks = [];
                recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

                const recordingStopped = new Promise(resolve => { recorder.onstop = resolve; });
                recorder.start();

                for (let i = 0; i < selectedItems.length; i++) {
                    const item = selectedItems[i];
                    statusText.innerText = `جاري دمج السناب (${i + 1} من ${selectedItems.length})...`;
                    mergeBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> (${i + 1}/${selectedItems.length})`;

                    await playAndDrawItemToCanvas(item, canvas, ctx, audioCtx, dest);
                }

                recorder.stop();
                await recordingStopped;

                const ext = supportedMime.includes('mp4') ? 'mp4' : 'webm';
                const finalBlob = new Blob(chunks, { type: supportedMime || 'video/mp4' });
                const fileName = `${currentUsername}_merged_${Date.now()}.${ext}`;

                statusText.innerText = 'اكتمل الدمج! جاري الحفظ...';
                await saveOrShareBlob(finalBlob, fileName);

            } catch (err) {
                console.error(err);
                alert('تعذر الدمج المباشر بسبب قيود CORS على أحد المقاطع، سيتم حفظها لك بشكل متتالي.');
                downloadSelectedIndividually();
            } finally {
                mergeBtn.disabled = false;
                mergeBtn.innerHTML = '<i class="fa-solid fa-film"></i> دمج وحفظ كفيديو واحد';
                statusText.innerText = 'جاهز للدمج في مقطع فيديو واحد';
            }
        }

        function playAndDrawItemToCanvas(item, canvas, ctx, audioCtx, dest) {
            return new Promise((resolve) => {
                if (item.type === 'image') {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        let elapsed = 0;
                        const interval = setInterval(() => {
                            ctx.fillStyle = '#000';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            elapsed += 33;
                            if (elapsed >= 3000) { clearInterval(interval); resolve(); }
                        }, 33);
                    };
                    img.onerror = () => resolve();
                    img.src = `https://corsproxy.io/?${encodeURIComponent(item.url)}`;
                } else {
                    const video = document.createElement('video');
                    video.crossOrigin = 'anonymous';
                    video.playsInline = true;
                    video.src = `https://corsproxy.io/?${encodeURIComponent(item.url)}`;

                    video.onloadedmetadata = () => {
                        try {
                            const source = audioCtx.createMediaElementSource(video);
                            source.connect(dest);
                        } catch (e) {}
                        video.play().catch(() => resolve());
                    };

                    const drawFrame = () => {
                        if (!video.paused && !video.ended) {
                            ctx.fillStyle = '#000';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            requestAnimationFrame(drawFrame);
                        }
                    };

                    video.onplay = () => drawFrame();
                    video.onended = () => resolve();
                    video.onerror = () => resolve();
                }
            });
        }

        // ====== التحميل والمشاركة المباشرة لألبوم الآيفون ======
        async function saveOrShareBlob(blob, fileName) {
            const file = new File([blob], fileName, { type: blob.type });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'حفظ من SnapVault'
                    });
                    return;
                } catch (e) {}
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        async function downloadSingleMedia(url, fileName) {
            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                const res = await fetch(proxyUrl);
                const blob = await res.blob();
                await saveOrShareBlob(blob, fileName);
            } catch (e) {
                window.open(url, '_blank');
            }
        }

        async function downloadSelectedIndividually() {
            const selectedItems = filteredItems.filter(item => selectedIds.has(item.id));
            for (const item of selectedItems) {
                await downloadSingleMedia(item.url, `${currentUsername}_${item.id}.mp4`);
            }
        }

        function downloadAvatar() {
            const avatarUrl = document.getElementById('profileAvatar').src;
            downloadSingleMedia(avatarUrl, `${currentUsername}_avatar.jpg`);
        }

        // ====== مشغل الستوري الكامل ======
        function openStoryViewer(index) {
            if (filteredItems.length === 0) return;
            currentStoryIndex = index;
            const modal = document.getElementById('storyPlayerModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            showStoryAtIndex(currentStoryIndex);
        }

        function showStoryAtIndex(index) {
            clearTimeout(imageStoryTimer);
            const videoEl = document.getElementById('playerVideo');
            const imageEl = document.getElementById('playerImage');
            videoEl.pause();

            if (index < 0) index = 0;
            if (index >= filteredItems.length) {
                closeStoryViewer();
                return;
            }
            currentStoryIndex = index;
            const item = filteredItems[index];

            // تحديث أشرطة التقدم
            const barsContainer = document.getElementById('playerProgressBars');
            barsContainer.innerHTML = filteredItems.map((_, i) => `
                <div class="h-1 flex-1 rounded-full bg-white/25 overflow-hidden">
                    <div class="h-full bg-[#FFFC00] transition-all duration-300" style="width: ${i <= index ? '100%' : '0%'}"></div>
                </div>
            `).join('');

            document.getElementById('playerTime').innerText = item.title;

            if (item.type === 'video') {
                imageEl.classList.add('hidden');
                videoEl.classList.remove('hidden');
                videoEl.src = item.url;
                videoEl.play().catch(() => {});
                videoEl.onended = () => nextStory();
            } else {
                videoEl.classList.add('hidden');
                imageEl.classList.remove('hidden');
                imageEl.src = item.url;
                imageStoryTimer = setTimeout(() => nextStory(), 4000);
            }
        }

        function nextStory() { showStoryAtIndex(currentStoryIndex + 1); }
        function prevStory() { showStoryAtIndex(currentStoryIndex - 1); }

        function closeStoryViewer() {
            clearTimeout(imageStoryTimer);
            const videoEl = document.getElementById('playerVideo');
            videoEl.pause();
            videoEl.src = '';
            const modal = document.getElementById('storyPlayerModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function downloadCurrentStoryItem() {
            const item = filteredItems[currentStoryIndex];
            if (item) downloadSingleMedia(item.url, `${currentUsername}_${item.id}.mp4`);
        }

        function copyProfileLink() {
            navigator.clipboard.writeText(`https://www.snapchat.com/@${currentUsername}`);
            alert('تم نسخ رابط حساب السناب!');
        }

        function refreshProfile() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('animate-spin');
            loadUserProfile().finally(() => setTimeout(() => icon.classList.remove('animate-spin'), 600));
        }

        // بدء التشغيل
        loadUserProfile();
    </script>
</body>
</html>
