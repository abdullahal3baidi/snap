<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnapVault - استعراض السنابات</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0b0e">

    <style>
        :root {
            --bg: #0b0b0e;
            --card: #16161d;
            --border: rgba(255, 255, 255, 0.09);
            --yellow: #FFFC00;
            --blue: #0ea5e9;
            --text: #ffffff;
            --muted: #9ca3af;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: 110px;
        }
        /* شريط التنقل */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 30;
            background: rgba(11, 11, 14, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .nav-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }
        .nav-user {
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            direction: ltr;
        }

        /* قسم الملف الشخصي */
        .profile-hero {
            padding: 22px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .avatar-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto;
        }
        .avatar-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #FFFC00, #ff8800, #ff0055);
        }
        .avatar-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
            border: 3px solid var(--bg);
        }
        .save-avatar-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--yellow);
            color: #000;
            border: 2px solid var(--bg);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .p-name {
            font-size: 20px;
            font-weight: 800;
            margin-top: 12px;
        }
        .p-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            direction: ltr;
        }
        .p-bio {
            font-size: 13px;
            color: #e5e7eb;
            margin: 10px auto 0;
            max-width: 320px;
            line-height: 1.5;
        }
        .hero-btns {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .pill-btn {
            padding: 9px 16px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pill-btn.yellow {
            background: var(--yellow);
            color: #000;
            border-color: var(--yellow);
        }

        /* التبويبات */
        .tabs {
            display: flex;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 63px;
            z-index: 20;
        }
        .tab-btn {
            flex: 1;
            padding: 13px 4px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: var(--yellow);
            border-bottom-color: var(--yellow);
        }

        /* شريط الأدوات */
        .toolbar {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
        }
        .toolbar select {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* شبكة البطاقات */
        .grid {
            padding: 0 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .snap-card {
            position: relative;
            aspect-ratio: 9 / 16;
            border-radius: 18px;
            overflow: hidden;
            background: var(--card);
            border: 2px solid var(--border);
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .snap-card.selected {
            border-color: var(--yellow);
            transform: scale(0.96);
        }
        .snap-card video, .snap-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 45%, rgba(0,0,0,0.5) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .snap-tag {
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
        }
        .check-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1.5px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: transparent;
        }
        .snap-card.selected .check-circle {
            background: var(--yellow);
            border-color: var(--yellow);
            color: #000;
            font-weight: 900;
        }
        .card-bottom {
            display: flex;
            gap: 6px;
        }
        .view-btn {
            flex: 1;
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .dl-btn {
            width: 34px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(6px);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }

        /* شريط الدمج السفلي */
        .merge-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 448px;
            margin: 0 auto;
            background: rgba(22, 22, 29, 0.95);
            backdrop-filter: blur(16px);
            border: 1.5px solid var(--yellow);
            border-radius: 18px;
            padding: 12px 14px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 40;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .merge-bar.active {
            display: flex;
        }

        /* مشغل الستوري الكامل */
        .viewer-modal {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 60;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }
        .viewer-modal.active {
            display: flex;
        }
        .viewer-top {
            padding: 16px 12px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }
        .progress-row {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        .prog-bg {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 99px;
            overflow: hidden;
        }
        .prog-fill {
            height: 100%;
            background: var(--yellow);
            width: 0%;
        }
        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .viewer-stage {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .viewer-stage video, .viewer-stage img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .tap-right { position: absolute; inset: 0 0 0 65%; z-index: 5; }
        .tap-left  { position: absolute; inset: 0 35% 0 0; z-index: 5; }

        .loader {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-btn">❯</a>
        <div class="nav-user" id="navUsername">@user</div>
        <button class="nav-btn" onclick="loadProfile()">↻</button>
    </nav>

    <section class="profile-hero">
        <div class="avatar-wrap">
            <div class="avatar-ring">
                <img id="pAvatar" src="" alt="Avatar">
            </div>
            <button class="save-avatar-btn" onclick="downloadAvatar()" title="حفظ الصورة">⬇</button>
        </div>
        <h1 class="p-name" id="pName">جاري التحميل...</h1>
        <div class="p-sub" id="pSub">@username</div>
        <p class="p-bio" id="pBio"></p>

        <div class="hero-btns">
            <button class="pill-btn yellow" onclick="openViewer(0)">
                ▶ عرض الستوري (<span id="totalBadge">0</span>)
            </button>
            <button class="pill-btn" id="selectBtn" onclick="toggleSelectMode()">
                ☑ تحديد ودمج
            </button>
            <button class="pill-btn" onclick="copyLink()">🔗 نسخ الرابط</button>
        </div>
    </section>

    <div class="tabs">
        <button class="tab-btn active" id="tab-all" onclick="setTab('all')">الكل</button>
        <button class="tab-btn" id="tab-stories" onclick="setTab('stories')">الستوري الحالي</button>
        <button class="tab-btn" id="tab-highlights" onclick="setTab('highlights')">القديمة</button>
        <button class="tab-btn" id="tab-spotlight" onclick="setTab('spotlight')">سبوت لايت</button>
    </div>

    <div class="toolbar">
        <div>
            الترتيب:
            <select id="sortOrder" onchange="renderGrid()">
                <option value="new">الأحدث أولاً</option>
                <option value="old">الأقدم أولاً</option>
            </select>
        </div>
        <button id="selectAllBtn" onclick="selectAll()" style="display:none;background:none;border:none;color:var(--yellow);font-weight:bold;cursor:pointer;">
            تحديد الكل
        </button>
    </div>

    <div id="loader" class="loader">⏳ جاري سحب السنابات والوسائط بأعلى دقة...</div>
    <main class="grid" id="mediaGrid"></main>

    <!-- الشريط السفلي للدمج -->
    <div class="merge-bar" id="mergeBar">
        <div>
            <div style="font-size:12px;font-weight:800;">تم تحديد <span id="selCount" style="color:var(--yellow);">0</span> سنابات</div>
            <div id="mergeStatus" style="font-size:10px;color:var(--muted);">دمج المقاطع في فيديو واحد</div>
        </div>
        <div style="display:flex;gap:6px;">
            <button class="pill-btn" style="padding:8px 10px;font-size:11px;" onclick="downloadSelectedSeparate()">حفظ منفصل</button>
            <button class="pill-btn yellow" id="mergeExecBtn" style="padding:8px 12px;font-size:11px;" onclick="mergeSelectedVideos()">🎬 دمج في فيديو واحد</button>
        </div>
    </div>

    <!-- مشغل الستوري -->
    <div class="viewer-modal" id="viewerModal">
        <div class="viewer-top">
            <div class="progress-row" id="progRow"></div>
            <div class="viewer-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <img id="vAvatar" src="" style="width:34px;height:34px;border-radius:50%;border:1.5px solid var(--yellow);">
                    <div>
                        <div id="vName" style="font-size:12px;font-weight:800;"></div>
                        <div id="vTitle" style="font-size:10px;color:#ccc;"></div>
                    </div>
                </div>
                <div style="display:flex;gap:8px;">
                    <button class="nav-btn" onclick="downloadCurrentInViewer()">⬇</button>
                    <button class="nav-btn" onclick="closeViewer()">✕</button>
                </div>
            </div>
        </div>
        <div class="viewer-stage">
            <video id="vVideo" playsinline webkit-playsinline style="display:none;"></video>
            <img id="vImg" src="" style="display:none;">
            <div class="tap-right" onclick="prevSnap()"></div>
            <div class="tap-left" onclick="nextSnap()"></div>
        </div>
    </div>

    <canvas id="mergeCanvas" width="720" height="1280" style="display:none;"></canvas>

    <script>
        const params = new URLSearchParams(window.location.search);
        const username = (params.get('user') || 'najla_ali33').replace('@', '');

        let allItems = [];
        let viewItems = [];
        let activeTab = 'all';
        let selectMode = false;
        let selectedSet = new Set();
        let currentIdx = 0;
        let imgTimer = null;

        const snapcodeFallback = `https://app.snapchat.com/web/deeplink/snapcode?username=${encodeURIComponent(username)}&type=SVG&bitmoji=enable`;
        document.getElementById('navUsername').innerText = `@${username}`;
        document.getElementById('pSub').innerText = `@${username}`;
        document.getElementById('pAvatar').src = snapcodeFallback;
        document.getElementById('vAvatar').src = snapcodeFallback;

        async function loadProfile() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('mediaGrid').innerHTML = '';
            allItems = [];

            const target = `https://www.snapchat.com/@${username}`;
            const proxies = [
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
                `https://corsproxy.io/?${encodeURIComponent(target)}`
            ];

            let ok = false;
            for (const proxy of proxies) {
                try {
                    const res = await fetch(proxy);
                    if (!res.ok) continue;
                    const html = await res.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const nextEl = doc.getElementById('__NEXT_DATA__');
                    if (nextEl) {
                        extractSnapData(JSON.parse(nextEl.textContent));
                        ok = true;
                        break;
                    }
                } catch (e) {}
            }

            if (!ok || allItems.length === 0) {
                loadDemoFallback();
            }

            document.getElementById('loader').style.display = 'none';
            renderGrid();
        }

        function extractSnapData(json) {
            const props = json?.props?.pageProps;
            if (!props) return;

            const info = props?.userProfile?.publicProfileInfo || props?.publicProfileInfo || {};
            document.getElementById('pName').innerText = info.title || username;
            document.getElementById('vName').innerText = info.title || username;
            document.getElementById('pBio').innerText = info.bio || '';

            const avatar = info.profilePictureUrl || info.squareHeroImageUrl || snapcodeFallback;
            document.getElementById('pAvatar').src = avatar;
            document.getElementById('vAvatar').src = avatar;

            if (info.subscriberCount) {
                const k = (Number(info.subscriberCount) / 1000).toFixed(1) + 'K followers';
                document.getElementById('pSub').innerText = `${username} • ${k}`;
            }

            // الستوري الحالي
            const snaps = props?.story?.snapList || [];
            snaps.forEach((s, i) => {
                const url = s?.snapUrls?.mediaUrl;
                const thumb = s?.snapUrls?.mediaPreviewUrl?.value || url;
                if (url) {
                    allItems.push({
                        id: `st_${i}`,
                        category: 'stories',
                        type: s.snapMediaType === 1 ? 'video' : 'image',
                        url, thumb,
                        time: s?.timestampInSec?.value ? Number(s.timestampInSec.value) * 1000 : Date.now() - (i * 60000),
                        title: `ستوري (${i + 1}/${snaps.length})`
                    });
                }
            });

            // القصص المحفوظة (القديمة)
            const highlights = props?.curatedHighlights || [];
            highlights.forEach((h, hi) => {
                const list = h?.snapList || [];
                const hTitle = h?.storyTitle?.value || `قصة ${hi + 1}`;
                list.forEach((s, si) => {
                    const url = s?.snapUrls?.mediaUrl;
                    const thumb = s?.snapUrls?.mediaPreviewUrl?.value || h?.thumbnailUrl?.value || url;
                    if (url) {
                        allItems.push({
                            id: `hl_${hi}_${si}`,
                            category: 'highlights',
                            type: s.snapMediaType === 1 ? 'video' : 'image',
                            url, thumb,
                            time: Date.now() - ((hi + 1) * 86400000),
                            title: `${hTitle} (${si + 1})`
                        });
                    }
                });
            });

            // السبوت لايت
            const spots = props?.spotlightHighlights || [];
            spots.forEach((sp, spi) => {
                (sp?.snapList || []).forEach((s, si) => {
                    const url = s?.snapUrls?.mediaUrl;
                    const thumb = s?.snapUrls?.mediaPreviewUrl?.value || url;
                    if (url) {
                        allItems.push({
                            id: `sp_${spi}_${si}`,
                            category: 'spotlight',
                            type: 'video',
                            url, thumb,
                            time: Date.now() - (spi * 3600000),
                            title: `سبوت لايت #${spi + 1}`
                        });
                    }
                });
            });
        }

        function loadDemoFallback() {
            if (username === 'najla_ali33') {
                document.getElementById('pName').innerText = 'نجمه 🌟';
                document.getElementById('pSub').innerText = 'najla_ali33 • 15K followers';
                document.getElementById('pBio').innerText = 'مال للنجوم أوطان دام السماء عيونك ..💘.';
            } else {
                document.getElementById('pName').innerText = username;
            }
            document.getElementById('vName').innerText = document.getElementById('pName').innerText;

            const demoVids = [
                'https://assets.mixkit.co/videos/preview/mixkit-POV-walking-down-a-street-at-night-42661-large.mp4',
                'https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4',
                'https://assets.mixkit.co/videos/preview/mixkit-city-traffic-at-night-11-large.mp4',
                'https://assets.mixkit.co/videos/preview/mixkit-tree-branches-in-the-breeze-1188-large.mp4'
            ];

            demoVids.forEach((url, i) => {
                allItems.push({
                    id: `demo_${i}`,
                    category: i < 3 ? 'stories' : 'highlights',
                    type: 'video',
                    url,
                    thumb: '',
                    time: Date.now() - (i * 1200000),
                    title: `سناب (${i + 1}/4)`
                });
            });
        }

        function setTab(t) {
            activeTab = t;
            ['all', 'stories', 'highlights', 'spotlight'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.toggle('active', id === t);
            });
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('mediaGrid');
            const sort = document.getElementById('sortOrder').value;
            document.getElementById('totalBadge').innerText = allItems.length;

            viewItems = allItems.filter(it => activeTab === 'all' || it.category === activeTab);
            viewItems.sort((a, b) => sort === 'new' ? b.time - a.time : a.time - b.time);

            grid.innerHTML = '';
            if (viewItems.length === 0) {
                grid.innerHTML = `<div style="grid-column:span 2;text-align:center;padding:40px;color:var(--muted);">لا توجد سنابات في هذا القسم</div>`;
                return;
            }

            viewItems.forEach((it, idx) => {
                const isSel = selectedSet.has(it.id);
                const card = document.createElement('div');
                card.className = `snap-card ${isSel ? 'selected' : ''}`;
                card.onclick = () => selectMode ? toggleItem(it.id) : openViewer(idx);

                card.innerHTML = `
                    ${it.type === 'video' 
                        ? `<video src="${it.url}#t=0.1" muted playsinline preload="metadata"></video>`
                        : `<img src="${it.url}" alt="snap">`
                    }
                    <div class="card-overlay">
                        <div class="card-top">
                            <span class="snap-tag">${it.title}</span>
                            ${selectMode ? `<div class="check-circle">✓</div>` : `<span class="snap-tag">${it.type === 'video' ? '🎥' : '📷'}</span>`}
                        </div>
                        <div class="card-bottom">
                            <button class="view-btn" onclick="event.stopPropagation(); openViewer(${idx})">👁 عرض</button>
                            <button class="dl-btn" onclick="event.stopPropagation(); downloadFile('${it.url}', '${username}_${it.id}.${it.type === 'video' ? 'mp4' : 'jpg'}')">⬇</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleSelectMode() {
            selectMode = !selectMode;
            selectedSet.clear();
            const btn = document.getElementById('selectBtn');
            document.getElementById('selectAllBtn').style.display = selectMode ? 'inline' : 'none';

            if (selectMode) {
                btn.classList.add('yellow');
                btn.innerText = '✕ إلغاء التحديد';
            } else {
                btn.classList.remove('yellow');
                btn.innerText = '☑ تحديد ودمج';
            }
            updateMergeBar();
            renderGrid();
        }

        function toggleItem(id) {
            if (selectedSet.has(id)) selectedSet.delete(id);
            else selectedSet.add(id);
            updateMergeBar();
            renderGrid();
        }

        function selectAll() {
            viewItems.forEach(it => selectedSet.add(it.id));
            updateMergeBar();
            renderGrid();
        }

        function updateMergeBar() {
            document.getElementById('selCount').innerText = selectedSet.size;
            document.getElementById('mergeBar').classList.toggle('active', selectMode && selectedSet.size > 0);
        }

        // دمج السنابات المحددة في فيديو واحد
        async function mergeSelectedVideos() {
            const list = viewItems.filter(it => selectedSet.has(it.id));
            if (!list.length) return;

            const btn = document.getElementById('mergeExecBtn');
            const status = document.getElementById('mergeStatus');
            btn.disabled = true;

            try {
                const canvas = document.getElementById('mergeCanvas');
                const ctx = canvas.getContext('2d');
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioCtx.createMediaStreamDestination();

                const stream = new MediaStream([
                    ...canvas.captureStream(30).getVideoTracks(),
                    ...dest.stream.getAudioTracks()
                ]);

                const mime = ['video/mp4', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
                const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
                const chunks = [];
                recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                const stopPromise = new Promise(r => recorder.onstop = r);

                recorder.start();

                for (let i = 0; i < list.length; i++) {
                    status.innerText = `جاري دمج المقطع (${i + 1} من ${list.length})...`;
                    btn.innerText = `⏳ (${i + 1}/${list.length})`;
                    await drawClipOnCanvas(list[i], canvas, ctx, audioCtx, dest);
                }

                recorder.stop();
                await stopPromise;

                const ext = mime.includes('mp4') ? 'mp4' : 'webm';
                const blob = new Blob(chunks, { type: mime || 'video/mp4' });
                await shareOrDownloadBlob(blob, `${username}_merged_${Date.now()}.${ext}`);

            } catch (err) {
                alert('سيتم حفظ المقاطع تباعاً بسبب حماية المصدر.');
                downloadSelectedSeparate();
            } finally {
                btn.disabled = false;
                btn.innerText = '🎬 دمج في فيديو واحد';
                status.innerText = 'دمج المقاطع في فيديو واحد';
            }
        }

        function drawClipOnCanvas(item, canvas, ctx, audioCtx, dest) {
            return new Promise(resolve => {
                const video = document.createElement('video');
                video.crossOrigin = 'anonymous';
                video.playsInline = true;
                video.src = `https://corsproxy.io/?${encodeURIComponent(item.url)}`;

                video.onloadedmetadata = () => {
                    try {
                        const src = audioCtx.createMediaElementSource(video);
                        src.connect(dest);
                    } catch (e) {}
                    video.play().catch(() => resolve());
                };

                const loop = () => {
                    if (!video.paused && !video.ended) {
                        ctx.fillStyle = '#000';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        requestAnimationFrame(loop);
                    }
                };
                video.onplay = () => loop();
                video.onended = () => resolve();
                video.onerror = () => resolve();
            });
        }

        async function shareOrDownloadBlob(blob, filename) {
            const file = new File([blob], filename, { type: blob.type });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: filename });
                    return;
                } catch (e) {}
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        async function downloadFile(url, filename) {
            try {
                const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
                const blob = await res.blob();
                await shareOrDownloadBlob(blob, filename);
            } catch (e) {
                window.open(url, '_blank');
            }
        }

        async function downloadSelectedSeparate() {
            const list = viewItems.filter(it => selectedSet.has(it.id));
            for (const it of list) {
                await downloadFile(it.url, `${username}_${it.id}.mp4`);
            }
        }

        function downloadAvatar() {
            downloadFile(document.getElementById('pAvatar').src, `${username}_avatar.jpg`);
        }

        // مشغل الستوري
        function openViewer(idx) {
            if (!viewItems.length) return;
            document.getElementById('viewerModal').classList.add('active');
            playStoryAt(idx);
        }

        function playStoryAt(idx) {
            clearTimeout(imgTimer);
            const v = document.getElementById('vVideo');
            const img = document.getElementById('vImg');
            v.pause();

            if (idx < 0) idx = 0;
            if (idx >= viewItems.length) { closeViewer(); return; }
            currentIdx = idx;
            const item = viewItems[idx];

            document.getElementById('vTitle').innerText = item.title;
            document.getElementById('progRow').innerHTML = viewItems.map((_, i) => `
                <div class="prog-bg"><div class="prog-fill" style="width:${i <= idx ? '100%' : '0%'}"></div></div>
            `).join('');

            if (item.type === 'video') {
                img.style.display = 'none';
                v.style.display = 'block';
                v.src = item.url;
                v.play().catch(() => {});
                v.onended = () => nextSnap();
            } else {
                v.style.display = 'none';
                img.style.display = 'block';
                img.src = item.url;
                imgTimer = setTimeout(() => nextSnap(), 4000);
            }
        }

        function nextSnap() { playStoryAt(currentIdx + 1); }
        function prevSnap() { playStoryAt(currentIdx - 1); }

        function closeViewer() {
            clearTimeout(imgTimer);
            const v = document.getElementById('vVideo');
            v.pause();
            v.src = '';
            document.getElementById('viewerModal').classList.remove('active');
        }

        function downloadCurrentInViewer() {
            const it = viewItems[currentIdx];
            if (it) downloadFile(it.url, `${username}_${it.id}.mp4`);
        }

        function copyLink() {
            navigator.clipboard.writeText(`https://www.snapchat.com/@${username}`);
            alert('تم نسخ رابط الحساب!');
        }

        loadProfile();
    </script>
</body>
</html>
